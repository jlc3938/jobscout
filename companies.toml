# ---------------------------------------------------------------------------
# Filters
# ---------------------------------------------------------------------------
[filters]
# Regexes matched against job titles (case-insensitive). A job must match at
# least one include and no excludes.
title_include = [
  "engineering manager",
  "manager,? (of )?(software )?engineering",
  "software engineering manager",
  "manager.*(platform|infrastructure|developer (experience|productivity)|devops|sre|reliability)",
  "(platform|infrastructure|developer experience|devex|ai|ml) .*manager",
  "head of (platform|infrastructure|engineering)",
  "director.*(engineering|platform|infrastructure)",
]
title_exclude = [
  "intern", "product manager", "program manager", "project manager",
  "account", "sales", "marketing", "recruit", "customer success",
  "technical account", "solutions", "partner manager", "hardware",
]

# A job's location must contain one of these, OR be remote (if allowed).
locations = [
  "mckinney", "plano", "frisco", "allen", "richardson", "dallas", "irving",
  "addison", "fort worth", "las colinas", "westlake", "texas", ", tx",
]
allow_remote = true
# Remote roles tied to these regions are dropped.
remote_exclude = [
  "canada", "uk", "united kingdom", "london", "europe", "emea", "india",
  "apac", "australia", "germany", "ireland", "brazil", "latam", "singapore",
]
# Keep jobs with blank or "N Locations" text so you can check them by hand.
keep_unknown_location = true

# Workday needs search terms; it returns every job otherwise.
workday_search = ["engineering manager", "software engineering manager", "director of engineering"]

# ---------------------------------------------------------------------------
